name: Build CleanYourTV Weather APK
on:
  push:
    paths:
      - '.github/workflows/build-weather.yml'
  workflow_dispatch:
jobs:
  build-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout upstream source
        run: git clone --depth 1 https://github.com/Gathin23/cleanyourtv.git upstream
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          mkdir -p "$SDK_ROOT/licenses"
          printf '8933bad161af4178b1185d1a37fbf41ea5269\n' > "$SDK_ROOT/licenses/android-sdk-license"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Build official Weather module
        working-directory: upstream/addons/weather
        run: bash ./gradlew assembleRelease --no-daemon
      - name: Upload Weather APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-weather-apk
          path: upstream/addons/weather/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
